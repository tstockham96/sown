<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111214" />
<meta name="description" content="FOURS: a daily number puzzle. Drag a tile to spread its number across the line, +1 each. Any tile that hits exactly 4 clears." />
<meta property="og:title" content="FOURS: today's board" />
<meta property="og:description" content="Ten moves. Drag a tile to spread its number across the line, +1 each. Any tile that hits exactly 4 clears. Line up the combos." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://tstockham96.github.io/sown/" />
<meta name="twitter:card" content="summary" />
<meta name="apple-mobile-web-app-title" content="FOURS" />
<title>FOURS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111214'/%3E%3Crect x='8' y='8' width='48' height='48' rx='10' fill='%23f2542d'/%3E%3Cpath d='M36 17h7v20h5v6h-5v6h-7v-6H17v-6l14-20h5zm0 9-8 11h8z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon" id="btn-help" aria-label="How to play" data-testid="help">?</button>
    <div class="brand">
      <div class="logo" aria-label="FOURS">FOUR<span>S</span></div>
      <div class="sub" data-testid="sub"></div>
    </div>
    <button class="icon" id="btn-stats" aria-label="Stats" data-testid="stats-btn">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 20V11M12 20V5M19 20v-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="banner hidden" data-testid="challenge-banner"></div>
  <div class="play">
    <div class="example hidden" data-testid="example"></div>
    <main class="stage">
      <div class="frame" id="frame">
        <div class="board" id="board" data-testid="board"></div>
        <div class="fly" id="fly"></div>
        <div class="title-card hidden" data-testid="title-card"><small></small><b></b></div>
      </div>
    </main>
    <section class="tracker">
      <div class="pips" data-testid="pips"></div>
      <div class="count" data-testid="count"></div>
    </section>
    <div class="toast" data-testid="toast"></div>
    <p class="caption" data-testid="caption"></p>
    <div class="cta hidden" data-testid="cta-results"><button class="btn primary" id="btn-results">See results</button></div>
  </div>
  <footer class="tagline" data-testid="tagline">A new board every midnight</footer>

  <div class="scrim hidden" id="scrim"></div>
  <section class="sheet" id="sheet-results" data-testid="results" aria-hidden="true"></section>
  <section class="sheet" id="sheet-stats" data-testid="stats" aria-hidden="true"></section>
  <section class="sheet" id="sheet-help" data-testid="help-sheet" aria-hidden="true"></section>
  <section class="sheet" id="sheet-archive" data-testid="archive" aria-hidden="true"></section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
